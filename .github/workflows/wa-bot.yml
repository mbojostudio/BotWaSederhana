name: WhatsApp Bot Runner

on:
  schedule:
    - cron: '0 */6 * * *'  # Restart otomatis setiap 6 jam
  workflow_dispatch:  # Bisa dijalankan manual dari GitHub Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        
      - name: Set environment variable
        run: echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> $GITHUB_ENV


      - name: Start WhatsApp Bot
        run: npm run start
